        <text x="40" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="120" y="552" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="142" y="560" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Core library</text>

        <rect x="236" y="552" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="258" y="560" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Library / tool</text>

        <rect x="372" y="552" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
